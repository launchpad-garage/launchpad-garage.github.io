baseURL: https://launchpad-garage.github.io/
locale: en-us
title: LaunchPad
theme: ["hugo-embed-pdf-shortcode","PaperMod"]
publishDir: docs

# Fix for PaperMod rss.xml Author error
author:
  name: "LaunchPad Team"
  email: "launchpad.garagentu@gmail.com"

enableRobotsTXT: true
buildDrafts: false
buildFuture: true
buildExpired: false
enableEmoji: true
enableInlineShortcodes: true

outputs:
  home:
    - HTML
    - JSON # necessary for search
    # - RSS  <-- (Optionally comment this out if you do not use RSS)

markup:
  goldmark:
    renderer:
      unsafe: true

menu:
  main:
    - name: Modules
      url: modules/
      weight: 5
    - name: Search
      url: search
      weight: 10

params:
  author: "LaunchPad Team"
  images: ["launchpad-rec.png"]
  defaultTheme: dark

  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true

  profileMode:
    enabled: true
    title: "✨ Welcome! ✨"
    subtitle: "onestop guided program to generate and develop your ideas ☄️"
    imageUrl: "launchpad.png"
    imageWidth: 60%
    imageHeight: 60%
    buttons:
      - name: View Modules
        url: "/modules"

  socialIcons:
    - name: "email"
      url: "mailto:launchpad.garagentu@gmail.com"
    - name: "github"
      url: "https://github.com/launchpad-garage/launchpad-garage.github.io"